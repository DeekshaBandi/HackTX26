; PlatformIO configuration for M5Stack Fire V2.7 PNG viewer
;
; Upload the PNG to the board filesystem with:
;   pio run -t uploadfs
; Then build/upload the firmware with:
;   pio run -t upload
;

[env:m5stack-fire]
platform = espressif32
board = m5stack-fire
framework = arduino
board_build.filesystem = littlefs
lib_deps =
    m5stack/M5Unified@^0.2.13
monitor_speed = 115200
monitor_filters =
    log2file
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset
; Use the actual USB serial port for the M5Stack Fire that appears in `pio device list`.
upload_port = /dev/cu.usbserial-5B090278141
monitor_port = /dev/cu.usbserial-5B090278141

; Manual download mode for stubborn ESP32 bootloader states
[env:m5stack-fire-manual]
extends = env:m5stack-fire
upload_speed = 921600
upload_flags =
    --before=no_reset
    --after=no_reset
